document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

lumn; align-items: center; min-width: 0; background-color: #FFFFFF\">\n    <div style=\"width:100%;max-width:600px;padding:{{ contentPadding }};padding-bottom:{{ contentPaddingBottom }};opacity:{{ fadeOpacity }};transition:opacity 180ms ease;\">\n\n      <!-- ============ HOME ============ -->\n      <sc-if value=\"{{ isHome }}\">\n        <div style=\"padding-top:8px;padding-bottom:8px;display:flex;align-items:flex-start;justify-content:space-between;\">\n          <div>\n            <p style=\"color: #000000; font-size: 15px; margin: 0\">{{ todayLabel }}<\u002Fp>\n            <h1 style=\"color: #1E293B; font-size: 24px; font-weight: 800; margin: 4px 0 0\">{{ greeting }}<\u002Fh1>\n            <p style=\"color: #37383A; font-size: 14px; margin: 6px 0 0\">Week {{ weekNumber }} · {{ yearLabel }}<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:14px;padding-top:2px;\">\n            <button onclick=\"{{ toggleAdminView }}\" title=\"Toggle admin/field view\" style=\"border:1px solid #E2E8F0;background:#FFFFFF;border-radius:9999px;padding:6px 12px;font-size:11px;font-weight:700;color:{{ adminToggleColor }};cursor:pointer;\">{{ adminToggleLabel }}<\u002Fbutton>\n            <button onclick=\"{{ goCrew }}\" style=\"position:relative;background:none;border:none;cursor:pointer;padding:0;\">\n              <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#94A3B8\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 12a8 8 0 1 1 4 6.9L4 20l1.4-3.6A7.9 7.9 0 0 1 4 12z\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n            <button onclick=\"{{ goAlerts }}\" style=\"position:relative;background:none;border:none;cursor:pointer;padding:0;\">\n              <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#94A3B8\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 9a6 6 0 0 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 13 6 9z\"><\u002Fpath><path d=\"M10 19a2 2 0 0 0 4 0\"><\u002Fpath><\u002Fsvg>\n              <sc-if value=\"{{ unreadAlertCount }}\">\n                <span style=\"position:absolute;top:-6px;right:-8px;background:#EF4444;color:white;font-size:9px;font-weight:700;border-radius:9999px;width:16px;height:16px;display:flex;align-items:center;justify-content:center;\">{{ unreadAlertCount }}<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:20px;display:flex;flex-direction:column;gap:20px;\">\n\n          <!-- weather -->\n          <div style=\"border-radius:18px;overflow:hidden;border:1px solid #E2E8F0;box-shadow:0 2px 12px rgba(0,0,0,0.06),0 1px 3px rgba(0,0,0,0.05);position:relative;\">\n            <div style=\"height:180px;background:linear-gradient(160deg,#5A8DEE 0%,#7FA6F0 45%,#B9CDF2 100%);position:relative;\">\n              <div style=\"position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.45),rgba(0,0,0,0.05) 60%);\"><\u002Fdiv>\n              <div style=\"position:relative;z-index:1;padding:16px;height:100%;display:flex;flex-direction:column;justify-content:space-between;\">\n                <span style=\"align-self:flex-start;color:rgba(255,255,255,0.85);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;background:rgba(0,0,0,0.35);padding:4px 12px;border-radius:9999px;\">Afternoon<\u002Fspan>\n                <div style=\"display:flex;align-items:flex-end;gap:12px;\">\n                  <span style=\"font-size:52px;font-weight:300;color:white;line-height:1;\">{{ weather.temp }}°<\u002Fspan>\n                  <div style=\"padding-bottom:4px;\">\n                    <p style=\"color:white;font-weight:700;margin:0;font-size:15px;\">{{ weather.condition }}<\u002Fp>\n                    <p style=\"color:rgba(255,255,255,0.85);font-size:13px;margin:2px 0 0;\">Feels like {{ weather.feelsLike }}°F<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background: #FFFFFF; padding: 14px 16px; display: grid; grid-template-columns: repeat(4,1fr); gap: 8px\">\n              <div style=\"display:flex;flex-direction:column;align-items:center;gap:4px;\">\n                <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#94A3B8\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3s6 6.5 6 10.5a6 6 0 0 1-12 0C6 9.5 12 3 12 3z\"><\u002Fpath><\u002Fsvg>\n                <span style=\"font-size:15px;font-weight:700;color:#1E293B;\">{{ weather.humidity }}%<\u002Fspan>\n                <span style=\"font-size: 11px; color: #434D5B; font-weight: 600\">Humidity<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;align-items:center;gap:4px;\">\n                <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#94A3B8\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 8h11a2.5 2.5 0 1 0-2.4-3.2M3 12h15a2.5 2.5 0 1 1-2.4 3.2M3 16h8\"><\u002Fpath><\u002Fsvg>\n                <span style=\"font-size:15px;font-weight:700;color:#1E293B;\">{{ weather.windSpeed }} mph<\u002Fspan>\n                <span style=\"font-size: 11px; color: #434D5B; font-weight: 600\">Wind<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;align-items:center;gap:4px;\">\n                <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#94A3B8\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><path d=\"M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1\"><\u002Fpath><\u002Fsvg>\n                <span style=\"font-size:15px;font-weight:700;color:#1E293B;\">{{ weather.uvIndex }}<\u002Fspan>\n                <span style=\"font-size: 11px; color: #434D5B; font-weight: 600\">UV Index<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;align-items:center;gap:4px;\">\n                <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#94A3B8\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3s6 6.5 6 10.5a6 6 0 0 1-12 0C6 9.5 12 3 12 3z\"><\u002Fpath><\u002Fsvg>\n                <span style=\"font-size:15px;font-weight:700;color:#1E293B;\">{{ weather.precipChance }}%<\u002Fspan>\n                <span style=\"font-size: 11px; color: #434D5B; font-weight: 600\">Precip<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <button onclick=\"{{ toggleWeather }}\" style=\"width: 100%; background: #FFFFFF; border: none; border-top: 1px solid #E2E8F0; padding: 11px; display: flex; align-items: center; justify-content: center; gap: 6px; color: #4F627C; font-size: 12px; cursor: pointer; font-weight: 600\">\n              {{ weatherToggleLabel }}\n              <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#94A3B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"transform:rotate({{ weatherChevronDeg }}deg);transition:transform 0.2s;\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n            <sc-if value=\"{{ weatherExpanded }}\">\n              <div style=\"background:#FFFFFF;padding:4px 16px 18px;\">\n                <p style=\"font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #0E1114; margin: 14px 0 10px\">Hourly<\u002Fp>\n                <div style=\"display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;\">\n                  <sc-for list=\"{{ weather.hourly }}\" as=\"h\" hint-placeholder-count=\"6\">\n                    <div style=\"flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:5px;background:#F7F8FA;border-radius:12px;padding:10px 12px;min-width:56px;\">\n                      <span style=\"font-size: 10px; color: #34373A; font-weight: 600\">{{ h.time }}<\u002Fspan>\n                      <span style=\"font-size:15px;font-weight:600;color:#1E293B;\">{{ h.temp }}°<\u002Fspan>\n                      <span style=\"font-size: 10px; color: #4A9FFF; font-weight: 600\">{{ h.precipLabel }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <p style=\"font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #0E1114; margin: 16px 0 10px\">5-Day<\u002Fp>\n                <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                  <sc-for list=\"{{ weather.daily }}\" as=\"d\" hint-placeholder-count=\"5\">\n                    <div style=\"display:flex;align-items:center;justify-content:space-between;background:#F7F8FA;border-radius:10px;padding:9px 14px;\">\n                      <span style=\"font-size:13px;font-weight:600;color:#1E293B;width:44px;\">{{ d.day }}<\u002Fspan>\n                      <span style=\"font-size: 12px; color: #4A9FFF; width: 32px; text-align: center; font-weight: 700\">{{ d.precipLabel }}<\u002Fspan>\n                      <span style=\"font-size:13px;color:#64748B;\">{{ d.low }}°<\u002Fspan>\n                      <div style=\"width:56px;height:6px;border-radius:9999px;background:#E2E8F0;overflow:hidden;\">\n                        <div style=\"height: 100%; border-radius: 9999px; background: linear-gradient(90deg, #3BACF688, #F59E0B); width: {{ d.rangePct }}%\"><\u002Fdiv>\n                      <\u002Fdiv>\n                      <span style=\"font-size:13px;font-weight:600;color:#1E293B;width:28px;text-align:right;\">{{ d.high }}°<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <!-- clock in card -->\n          <sc-if value=\"{{ clockedIn }}\">\n            <div style=\"border-radius:18px;overflow:hidden;border:1px solid rgba(16,185,129,0.35);background:linear-gradient(160deg,#0d3b2d,#0F1419);box-shadow:0 0 24px rgba(16,185,129,0.18);\">\n              <div style=\"padding:18px 18px 14px;\">\n                <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:12px;\">\n                  <div style=\"width:9px;height:9px;border-radius:50%;background:#34D399;animation:rc-pulse 2s infinite;\"><\u002Fdiv>\n                  <span style=\"color:#34D399;font-size:13px;font-weight:700;\">Clocked In<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;justify-content:space-between;\">\n                  <p style=\"color:#F1F5F9;font-size:28px;font-weight:300;font-family:monospace;letter-spacing:0.05em;margin:0;\">{{ elapsedLabel }}<\u002Fp>\n                  <div style=\"text-align:right;\">\n                    <p style=\"color:#F1F5F9;font-size:14px;font-weight:600;margin:0;\">{{ selectedSiteName }}<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;border-top:1px solid rgba(255,255,255,0.08);\">\n                <button onclick=\"{{ toggleBreak }}\" style=\"flex:1;background:none;border:none;padding:13px;display:flex;align-items:center;justify-content:center;gap:6px;color:#FBBF24;font-size:13px;font-weight:600;cursor:pointer;\">\n                  <sc-if value=\"{{ breakActive }}\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"#FBBF24\" stroke=\"none\"><path d=\"M7 5l12 7-12 7z\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                  <sc-if value=\"{{ !breakActive }}\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FBBF24\" stroke-width=\"2\"><rect x=\"6\" y=\"5\" width=\"4\" height=\"14\"><\u002Frect><rect x=\"14\" y=\"5\" width=\"4\" height=\"14\"><\u002Frect><\u002Fsvg><\u002Fsc-if>\n                  {{ breakLabel }}\n                <\u002Fbutton>\n                <div style=\"width:1px;background:rgba(255,255,255,0.08);\"><\u002Fdiv>\n                <button onclick=\"{{ openClockOut }}\" style=\"flex:1;background:none;border:none;padding:13px;display:flex;align-items:center;justify-content:center;gap:6px;color:#F87171;font-size:13px;font-weight:600;cursor:pointer;\">\n                  <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"#F87171\" stroke=\"none\"><rect x=\"6\" y=\"6\" width=\"12\" height=\"12\" rx=\"1.5\"><\u002Frect><\u002Fsvg>\n                  Clock Out\n                <\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ !clockedIn }}\">\n            <div style=\"border-radius:18px;overflow:hidden;border:1px solid #E2E8F0;background:#FFFFFF;box-shadow:0 2px 12px rgba(0,0,0,0.05);\">\n              <div style=\"padding:16px;display:flex;align-items:flex-start;justify-content:space-between;\">\n                <div>\n                  <p style=\"font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #333B43; margin: 0 0 4px\">Shift<\u002Fp>\n                  <p style=\"font-weight:700;color:#1E293B;margin:0;\">Grandview Heights Phase 3<\u002Fp>\n                  <p style=\"color: #303843; font-size: 13px; margin: 4px 0 0; display: flex; align-items: center; gap: 5px; font-weight: 600\">\n                    <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#94A3B8\" stroke-width=\"1.8\" style=\"stroke: #2C3037; stroke-width: 2px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 3\"><\u002Fpath><\u002Fsvg>\n                    08:00 – 17:00\n                  <\u002Fp>\n                <\u002Fdiv>\n                <div style=\"border: 1px solid rgba(37,99,235,0.25); border-radius: 12px; padding: 6px 12px; border-color: #00510140; background-color: #25EB7F1A\">\n                  <span style=\"color: #06621C; font-size: 12px; font-weight: 700\">Scheduled<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <button onclick=\"{{ openSitePicker }}\" style=\"width: 100%; border: none; padding: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; background-color: #0D8A60\">\n                <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"white\" stroke=\"none\"><path d=\"M7 5l12 7-12 7z\"><\u002Fpath><\u002Fsvg>\n                <span style=\"color:white;font-weight:700;font-size:15px;\">Clock In<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- sites -->\n          <div>\n            <h3 style=\"font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#1E293B;margin:0 0 12px;display:flex;align-items:center;gap:8px;\">\n              <span style=\"width:8px;height:8px;border-radius:50%;background:#34D399;\"><\u002Fspan>Active Sites\n            <\u002Fh3>\n            <div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:16px;\">\n              <sc-for list=\"{{ activeSites }}\" as=\"site\" hint-placeholder-count=\"5\">\n                <div style=\"background:#FFFFFF;border:1px solid #E2E8F0;border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;\">\n                  <span style=\"width:10px;height:10px;border-radius:50%;background:#34D399;flex-shrink:0;\"><\u002Fspan>\n                  <div style=\"flex:1;min-width:0;\">\n                    <p style=\"font-size:14px;font-weight:600;color:#1E293B;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ site.name }}<\u002Fp>\n                    <p style=\"font-size:12px;color:#64748B;margin:3px 0 0;display:flex;align-items:center;gap:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">\n                      <svg width=\"10\" height=\"10\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#64748B\" stroke-width=\"2\" style=\"flex-shrink:0;\"><path d=\"M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z\"><\u002Fpath><\u002Fsvg>{{ site.address }}\n                    <\u002Fp>\n                  <\u002Fdiv>\n                  <span style=\"font-size:10px;font-weight:700;padding:3px 10px;border-radius:9999px;background:rgba(52,211,153,0.15);color:#059669;flex-shrink:0;\">Active<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <button onclick=\"{{ toggleUpcoming }}\" style=\"width:100%;background:none;border:none;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;color:#64748B;cursor:pointer;\">\n              <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#94A3B8\" stroke-width=\"2\" style=\"transform:rotate({{ upcomingChevronDeg }}deg);transition:transform 0.2s;\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg>\n              <span style=\"font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;\">Show Upcoming Sites ({{ upcomingSites.length }})<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ showUpcoming }}\">\n              <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:8px;\">\n                <sc-for list=\"{{ upcomingSites }}\" as=\"site\" hint-placeholder-count=\"6\">\n                  <div style=\"background:#FFFFFF;border:1px solid #E2E8F0;border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;\">\n                    <span style=\"width:10px;height:10px;border-radius:50%;background:#FBBF24;flex-shrink:0;\"><\u002Fspan>\n                    <div style=\"flex:1;min-width:0;\">\n                      <p style=\"font-size:14px;font-weight:600;color:#1E293B;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ site.name }}<\u002Fp>\n                      <p style=\"font-size:12px;color:#64748B;margin:3px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ site.address }}<\u002Fp>\n                    <\u002Fdiv>\n                    <span style=\"font-size:10px;font-weight:700;padding:3px 10px;border-radius:9999px;background:rgba(251,191,36,0.15);color:#B45309;flex-shrink:0;\">Upcoming<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ TIMESHEET ============ -->\n      <sc-if value=\"{{ isTime }}\">\n        <div style=\"padding-top:8px;\">\n          <h1 style=\"color:#1E293B;font-size:24px;font-weight:800;margin:0;\">Timesheet<\u002Fh1>\n          <p style=\"color:#64748B;font-size:14px;margin:6px 0 0;\">Track your hours and shifts<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px;\">\n          <div style=\"background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 16px; box-shadow: 0px 4px 12px 0px rgba(0, 0, 0, 0.15)\">\n            <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:8px;\">\n              <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#2563EB\" stroke-width=\"1.8\" style=\"stroke: #0E1114\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 3\"><\u002Fpath><\u002Fsvg>\n              <span style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#94A3B8;\">Today<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font-size:22px;font-weight:800;color:#1E293B;margin:0;\">{{ todayHoursLabel }}<span style=\"font-size:13px;font-weight:400;color:#64748B;\">h<\u002Fspan><\u002Fp>\n            <sc-if value=\"{{ clockedIn }}\"><p style=\"color:#059669;font-size:12px;margin:6px 0 0;\">Currently clocked in<\u002Fp><\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 16px; box-shadow: 0px 4px 12px 0px rgba(0, 0, 0, 0.15)\">\n            <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:8px;\">\n              <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#60A5FA\" stroke-width=\"1.8\" style=\"stroke: #0E1114\"><rect x=\"4\" y=\"5.5\" width=\"16\" height=\"15\" rx=\"2\"><\u002Frect><path d=\"M4 10h16M8 3.5v3M16 3.5v3\"><\u002Fpath><\u002Fsvg>\n              <span style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#94A3B8;\">This Week<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font-size:22px;font-weight:800;color:#1E293B;margin:0;\">{{ weekHoursLabel }}<span style=\"font-size:13px;font-weight:400;color:#64748B;\">h<\u002Fspan><\u002Fp>\n            <p style=\"color:#64748B;font-size:12px;margin:6px 0 0;\">{{ remainingHoursLabel }}h remaining<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background: #FFFFFF; border: 1px solid {{ overtimeBorderColor }}; border-radius: 16px; padding: 16px; box-shadow: 0px 4px 12px 0px rgba(0, 0, 0, 0.15)\">\n            <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:8px;\">\n              <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FBBF24\" stroke-width=\"1.8\"><path d=\"M3 17l6-6 4 4 8-9\"><\u002Fpath><path d=\"M15 6h6v6\"><\u002Fpath><\u002Fsvg>\n              <span style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#94A3B8;\">Overtime<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font-size:22px;font-weight:800;color:{{ overtimeTextColor }};margin:0;\">{{ overtimeHoursLabel }}<span style=\"font-size:13px;font-weight:400;\">h<\u002Fspan><\u002Fp>\n            <p style=\"color:#64748B;font-size:12px;margin:6px 0 0;\">This week<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 16px; box-shadow: 0px 4px 12px 0px rgba(0, 0, 0, 0.15)\">\n            <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:8px;\">\n              <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#A78BFA\" stroke-width=\"1.8\"><rect x=\"4\" y=\"5.5\" width=\"16\" height=\"15\" rx=\"2\"><\u002Frect><path d=\"M4 10h16M8 3.5v3M16 3.5v3\"><\u002Fpath><\u002Fsvg>\n              <span style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#94A3B8;\">This Month<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font-size:22px;font-weight:800;color:#1E293B;margin:0;\">{{ monthHoursLabel }}<span style=\"font-size:13px;font-weight:400;color:#64748B;\">h<\u002Fspan><\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top: 12px; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 16px; box-shadow: 0px 4px 12px 0px rgba(0, 0, 0, 0.15)\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;\">\n            <span style=\"font-size: 12px; color: #313131; font-weight: 700\">Weekly Progress<\u002Fspan>\n            <span style=\"font-size: 12px; color: #404040; font-weight: 600\">{{ weekHoursLabel }} / 40h<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height:8px;background:#F0F1F4;border-radius:9999px;overflow:hidden;\">\n            <div style=\"height: 100%; border-radius: 9999px; background: linear-gradient(90deg, #EBE825, #22870A); width: {{ weekProgressPct }}%; transition: width 0.6s\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:20px;\">\n          <sc-if value=\"{{ clockedIn }}\">\n            <div style=\"border-radius:18px;overflow:hidden;border:1px solid rgba(16,185,129,0.35);background:linear-gradient(160deg,#0d3b2d,#0F1419);box-shadow:0 0 24px rgba(16,185,129,0.18);\">\n              <div style=\"padding:18px 18px 14px;\">\n                <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:12px;\">\n                  <div style=\"width:9px;height:9px;border-radius:50%;background:#34D399;animation:rc-pulse 2s infinite;\"><\u002Fdiv>\n                  <span style=\"color:#34D399;font-size:13px;font-weight:700;\">Clocked In<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;justify-content:space-between;\">\n                  <p style=\"color:#F1F5F9;font-size:26px;font-weight:300;font-family:monospace;letter-spacing:0.05em;margin:0;\">{{ elapsedLabel }}<\u002Fp>\n                  <p style=\"color:#F1F5F9;font-size:14px;font-weight:600;margin:0;\">{{ selectedSiteName }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;border-top:1px solid rgba(255,255,255,0.08);\">\n                <button onclick=\"{{ toggleBreak }}\" style=\"flex:1;background:none;border:none;padding:13px;color:#FBBF24;font-size:13px;font-weight:600;cursor:pointer;\">{{ breakLabel }}<\u002Fbutton>\n                <div style=\"width:1px;background:rgba(255,255,255,0.08);\"><\u002Fdiv>\n                <button onclick=\"{{ openClockOut }}\" style=\"flex:1;background:none;border:none;padding:13px;color:#F87171;font-size:13px;font-weight:600;cursor:pointer;\">Clock Out<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ !clockedIn }}\">\n            <button onclick=\"{{ openSitePicker }}\" style=\"width: 100%; border: none; padding: 16px; border-radius: 18px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; background-color: #0D8A60; box-shadow: 0px 4px 12px 0px rgba(0, 0, 0, 0.15)\">\n              <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"white\" stroke=\"none\"><path d=\"M7 5l12 7-12 7z\"><\u002Fpath><\u002Fsvg>\n              <span style=\"color:white;font-weight:700;font-size:15px;\">Clock In<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:24px;display:flex;align-items:center;justify-content:space-between;\">\n          <h3 style=\"font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #5C6771; margin: 0\">Week History<\u002Fh3>\n          <sc-if value=\"{{ isAdminView }}\">\n            <button onclick=\"{{ openManualEntry }}\" style=\"background: none; border: none; color: #22292F; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 5px; cursor: pointer\">\n              <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#2563EB\" stroke-width=\"2.2\" style=\"stroke: #293037\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg>Manual Entry\n            <\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;\">\n          <sc-for list=\"{{ timecards }}\" as=\"tc\" hint-placeholder-count=\"4\">\n            <div onclick=\"{{ tc.toggleExpand }}\" style=\"background: #FFFFFF; border: 1px solid {{ tc.borderColor }}; border-radius: 14px; padding: 14px; cursor: pointer; box-shadow: 0px 4px 12px 0px rgba(0, 0, 0, 0.15)\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;\">\n                <div>\n                  <p style=\"font-size:14px;font-weight:700;color:#1E293B;margin:0;\">{{ tc.dateLabel }}<\u002Fp>\n                  <p style=\"font-size:12px;color:#94         <h1 style=\"color:#1E293B;font-size:24px;font-weight:800;margin:0;\">Photos<\u002Fh1>\n            <p style=\"color:#64748B;font-size:14px;margin:6px 0 0;\">{{ photos.length }} site photos<\u002Fp>\n          <\u002Fdiv>\n          <button onclick=\"{{ openUpload }}\" style=\"border: none; color: #000000; border-radius: 12px; padding: 10px 16px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer; background-color: #9ADCA898\">\n            <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"white\" stroke-width=\"2.2\" style=\"stroke: #070707\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg>Upload\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:14px;\">\n          <sc-for list=\"{{ photos }}\" as=\"p\" hint-placeholder-count=\"4\">\n            <div style=\"background:#FFFFFF;border:1px solid #E2E8F0;border-radius:16px;overflow:hidden;\">\n              <div style=\"width:100%;aspect-ratio:4/3;background:#F0F1F4;overflow:hidden;\">\n                <img src=\"{{ p.url }}\" alt=\"{{ p.caption }}\" style=\"width:100%;height:100%;object-fit:cover;display:block;\">\n              <\u002Fdiv>\n              <div style=\"padding:12px;\">\n                <p style=\"font-size:13px;font-weight:700;color:#1E293B;margin:0;\">{{ p.siteName }}<\u002Fp>\n                <p style=\"font-size:11px;color:#94A3B8;margin:4px 0 0;\">{{ p.submittedBy }} · {{ p.timeLabel }}<\u002Fp>\n                <span style=\"display: inline-block; margin-top: 8px; font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 9999px; color: #000000; background-color: #813B001A\">{{ p.category }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ ALERTS LIST ============ -->\n      <sc-if value=\"{{ isAlerts }}\"
